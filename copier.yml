# Générateur create-gitsky-project (Chap 17) — spike Phase 2.
# API Copier réelle : context hook (résolution du catalogue de modules) +
# _tasks + _migrations. Le livre décrit des hooks style Cookiecutter
# (_pre/_post_generation) ; ici on utilise le vrai mécanisme Copier.

_subdirectory: template
_templates_suffix: .jinja

# ⚠️ _exclude est OBLIGATOIRE ici. Copier n'applique ses exclusions par défaut
# (__pycache__, *.pyc, ...) QUE si le template n'a pas de _subdirectory :
#
#     DEFAULT_EXCLUDE if Path(self.subdirectory) == Path() else []
#     (copier/_template.py, propriété `exclude`)
#
# Comme on déclare `_subdirectory: template`, la liste par défaut tombe à [] et
# TOUT le contenu du dossier est copié — y compris les artefacts locaux de la
# machine qui génère. Sans cette liste, les projets générés partaient avec 69
# fichiers .pyc et la base SQLite de développement du template, le tout committé
# par le `git add -A` des _tasks.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # Artefacts Python locaux.
  - "__pycache__"
  - "*.py[co]"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".venv"
  # Artefacts front locaux (un `npm install` dans le template embarquerait
  # sinon tout node_modules dans chaque projet généré).
  - "node_modules"
  - "dist"
  # Bases de développement : jamais livrer les données d'une machine de dev.
  - "*.db"
  - "*.sqlite3"

# Frontière châssis/vitrine (Chap 24 — GitSky Studio) : la DONNÉE de la
# landing art-dirigée par projet (skin/blocks/hero_image, produite une fois
# par Studio) est générée UNE fois puis JAMAIS écrasée par `copier update` —
# seul le fichier de données est protégé, pas les composants React qui la
# consomment (frontend/src/pages/Landing.tsx, frontend/src/components/
# blocks/**), qui reçoivent les correctifs de template normalement comme le
# reste du châssis. Avant ce round, toute la vitrine (données ET rendu HTML
# Jinja) vivait dans vitrine/** et était gelée en bloc — plus vrai depuis que
# la landing rend via l'app React partagée, quels que soient les modules actifs.
_skip_if_exists:
  - "frontend/src/landing-manifest.json"

# Le TemplateExtensionLoader permet de référencer une extension par chemin
# relatif au template (extensions/context.py) plutôt qu'un module installé.
_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions/context.py:ModuleResolver

# Contrat config.yaml du livre (Chap 17) : blocs top-level imbriqués. Le context
# hook dérive project_name / project_domain / gunicorn_workers depuis `project`.

# project : identité + domaine + workers. domain optionnel -> défaut wildcard
# {{ name }}.mystudio.com (Chap 1). workers optionnel -> défaut 2 (Chap 21).
project:
  type: yaml
  help: "Identité du projet : name, domain, workers"
  default:
    name: mon-projet

# Flags de modules à activer, clés courtes (sans le préfixe module_) — chaque
# module est un booléen indépendant, False si absent (Chap 2). Ex. : modules:
# { admin: true, agentic: true }
modules:
  type: yaml
  help: "Flags des modules à activer (ex. {admin: true, agentic: true})"
  default: {}

# Modèles métier à scaffolder dans app/domain/. Liste de { name, fields: { champ: type } },
# type ∈ str|text|int|bool|float|datetime.
data_models:
  type: yaml
  help: "Modèles métier (liste name + fields)"
  default: []

# Routeurs métier à scaffolder (liste prefix + handlers). Accepté ici pour le
# contrat complet ; le scaffolding routers.py est un incrément ultérieur.
domain_routes:
  type: yaml
  help: "Routeurs métier (liste prefix + handlers)"
  default: []

# Charte graphique injectée dans le frontend (variables CSS).
branding:
  type: yaml
  help: "Branding (primary_color, primary_foreground, font_family)"
  default:
    primary_color: "#4F46E5"
    primary_foreground: "#FFFFFF"
    font_family: "Inter"

# Vitrine (Chap 24) : landing pilotée par un schéma de blocs ordonnés. Le
# Studio produira ce schéma ; ici un défaut.
landing:
  type: yaml
  help: "Landing en blocs (skin + hero, email_capture, ...)"
  default:
    skin: clean
    blocks:
      - type: hero
        headline: "Bienvenue"
        subhead: "Une nouvelle idée à tester."
      - type: email_capture
        cta: "Rejoindre la liste"

# Flotte : enregistrement au fleet dashboard + compte Stripe partagé.
fleet:
  type: yaml
  help: "Flotte : register (bool), stripe_account"
  default:
    register: true

# Secrets générés une fois à la création, puis IMMUABLES sur `copier update`.
# Le default (calcul cryptographiquement sûr, SystemRandom via le filtre
# ans_random — voir la dépréciation de `make_secret` dans Copier) n'est évalué
# que s'il n'existe AUCUNE réponse antérieure : comportement natif d'une
# question Copier (Question.get_default : la valeur de .copier-answers.yml
# prime toujours sur le default), pas de logique custom nécessaire —
# contrairement à l'ancienne génération dans le context hook (Chap 18), qui
# régénérait une valeur À CHAQUE invocation, y compris `update`, cassant la
# base/session de chaque projet à chaque propagation de fix du chassis.
# PAS de `when: false` ici : empêche la persistance dans .copier-answers.yml
# (testé empiriquement), ce qui annulerait tout l'intérêt de la question —
# --defaults (toujours utilisé dans ce générateur) suffit à ne jamais
# demander interactivement une chaîne hexadécimale aléatoire.
secret_key:
  type: str
  default: "{{ 999999999999999999999999999999999|ans_random|hash('sha512') }}"

postgres_password:
  type: str
  default: "{{ 999999999999999999999999999999999|ans_random|hash('sha512') }}"

# _tasks : exécutés après la génération des fichiers (le « post » réel de Copier).
# Conditionnés à la GÉNÉRATION INITIALE (_copier_operation == 'copy') — pas au
# copier update, où c'est _migrations qui prend le relais.
# provision_db / register_fleet sont SIMULÉS (à connecter aux services réels).
# Scripts hors du sous-répertoire template/ -> non livrés dans le projet généré.
_tasks:
  - command: "{{ _copier_python }} {{ _copier_conf.src_path }}/tasks/provision_db.py {{ project_name }}"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "{{ _copier_python }} {{ _copier_conf.src_path }}/tasks/register_fleet.py {{ project_name }}"
    when: "{{ _copier_operation == 'copy' }}"
  # -b main : bug de prod réel (cryptokilla, 2026-08-29) — sans ce flag,
  # `git init` retombe sur `init.defaultBranch` de l'installation git
  # locale, "master" sur ce serveur. Le webhook GitHub filtre les push sur
  # `fleet_github_deploy_branch` (défaut "main", app/core/config.py) : un
  # premier push vers `master` était accepté par GitHub (200) mais
  # silencieusement ignoré par `is_deploy_push` — jamais de
  # `deploy_triggered`, jamais de premier déploiement, sans aucune erreur
  # visible nulle part. Fixé à la source plutôt que de compter sur
  # l'installation git de chaque serveur.
  - command: "git init -q -b main"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git add -A"
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git -c user.email=gen@gitsky -c user.name=create-gitsky-project commit -q -m "Initial commit (create-gitsky-project)"'
    when: "{{ _copier_operation == 'copy' }}"

# _migrations : exécutées lors d'un `copier update`, quand la version franchie
# est >= la version déclarée > l'ancienne version. Le script reçoit VERSION_FROM
# / VERSION_TO en variables d'environnement.
# ⚠️ SIMULÉ : représente la ré-application des migrations Alembic après évolution
# du template. À CONNECTER au vrai scripts/migrate.py du projet.
_migrations:
  - version: "1.0.0"
    command: "{{ _copier_python }} {{ _copier_conf.src_path }}/tasks/apply_migrations.py"
